[tool.poetry]
name = "pharma-core"
version = "0.1.0"
description = "Shared core library for pharma-analytics"
authors = []
packages = [{ include = "pharma_core" }]

[tool.poetry.dependencies]
python = "^3.11"
alembic = "^1.13"
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
