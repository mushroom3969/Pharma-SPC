<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYS-1-SPC 製程管制圖</title>
<style>
  .viz-root {
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6; /* blue */
    --series-6:       #e34948; /* red */
    --critical:       #d03b3b;
    --good:           #0ca30c;
  }
  @media (prefers-color-scheme: dark) {
    .viz-root {
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
      --series-6:       #e66767;
      --critical:       #e66767;
      --good:           #0ca30c;
    }
  }
  :root[data-theme="dark"] .viz-root {
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-1:       #3987e5;
    --series-6:       #e66767;
    --critical:       #e66767;
    --good:           #0ca30c;
  }
  :root[data-theme="light"] .viz-root {
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6;
    --series-6:       #e34948;
    --critical:       #d03b3b;
    --good:           #0ca30c;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane);
    color: var(--text-primary);
  }
  .app {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px 64px;
  }
  h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 24px;
  }
  .panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin: 0 0 14px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .field-row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: flex-end;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 180px;
  }
  .field label {
    font-size: 12.5px;
    color: var(--text-secondary);
  }
  select, input {
    font: inherit;
    font-size: 13.5px;
    padding: 7px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--page-plane);
    color: var(--text-primary);
  }
  select:disabled, input:disabled { opacity: 0.5; }
  button {
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 6px;
    border: none;
    background: var(--series-1);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button:hover:not(:disabled) { filter: brightness(1.08); }

  details.advanced { margin-top: 14px; }
  details.advanced summary {
    font-size: 12.5px;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .advanced-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    margin-top: 12px;
  }

  .error-box {
    background: var(--surface-1);
    border: 1px solid var(--critical);
    color: var(--critical);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    margin-bottom: 20px;
  }

  .chart-card h3 {
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .chart-card + .chart-card {
    margin-top: 20px;
  }
  .legend {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--text-secondary);
    margin: 4px 0 10px;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; }
  .legend-line { width: 14px; height: 0; border-top: 2px dashed var(--critical); }
  svg.chart { width: 100%; height: 220px; overflow: visible; }
  .axis-label { font-size: 10.5px; fill: var(--text-muted); }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--text-primary);
    color: var(--surface-1);
    font-size: 11.5px;
    padding: 4px 8px;
    border-radius: 5px;
    transform: translate(-50%, -130%);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.1s;
  }
  .chart-wrap { position: relative; }

  .placeholder {
    color: var(--text-muted);
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="viz-root app">
  <h1>SYS-1-SPC 製程管制圖</h1>
  <p class="subtitle">選擇製程參數與管制圖類型，結果由 mart 資料即時運算</p>

  <div class="panel">
    <h2>選擇資料</h2>
    <div class="field-row">
      <div class="field">
        <label for="canonical-feature">製程參數</label>
        <select id="canonical-feature"></select>
      </div>
      <div class="field">
        <label for="chart-type">管制圖類型</label>
        <select id="chart-type" disabled></select>
      </div>
      <div class="field">
        <button id="submit-btn" disabled>產生圖表</button>
      </div>
    </div>

    <details class="advanced">
      <summary>進階參數（選填）</summary>
      <div class="advanced-grid">
        <div class="field">
          <label for="p-usl">USL</label>
          <input id="p-usl" type="number" step="any">
        </div>
        <div class="field">
          <label for="p-lsl">LSL</label>
          <input id="p-lsl" type="number" step="any">
        </div>
        <div class="field">
          <label for="p-target">Target（CUSUM）</label>
          <input id="p-target" type="number" step="any">
        </div>
        <div class="field">
          <label for="p-lambda">λ（EWMA）</label>
          <input id="p-lambda" type="number" step="any" value="0.2">
        </div>
        <div class="field">
          <label for="p-k">k（CUSUM）</label>
          <input id="p-k" type="number" step="any" value="0.5">
        </div>
        <div class="field">
          <label for="p-h">h（CUSUM）</label>
          <input id="p-h" type="number" step="any" value="5.0">
        </div>
      </div>
    </details>
  </div>

  <div id="error-area"></div>
  <div id="result-area">
    <p class="placeholder">選擇製程參數與圖表類型後，按「產生圖表」查看結果。</p>
  </div>
</div>

<script>
const API_BASE = "";

// 目前 mart 只涵蓋這一張表（cell_culture_production_sec03）已定案的 5 個 canonical_feature。
// 之後擴充更多表 / 欄位時,這裡要跟著補,或改成向後端要一個「有哪些 canonical_feature」的 endpoint。
const CANONICAL_FEATURES = [
  "five_days_duration",
  "five_days_temp_max",
  "five_days_temp_min",
  "harvest_temp_max",
  "harvest_temp_min",
];

const CHART_TYPE_LABELS = {
  imr_plot: "I-MR",
  xr_plot: "Xbar-R",
  xs_plot: "Xbar-S",
  ewma_plot: "EWMA",
  cusum_plot: "CUSUM",
  spectral_plot: "Spec Limit",
};

const featureSelect = document.getElementById("canonical-feature");
const chartTypeSelect = document.getElementById("chart-type");
const submitBtn = document.getElementById("submit-btn");
const errorArea = document.getElementById("error-area");
const resultArea = document.getElementById("result-area");

for (const f of CANONICAL_FEATURES) {
  const opt = document.createElement("option");
  opt.value = f;
  opt.textContent = f;
  featureSelect.appendChild(opt);
}

function showError(message) {
  errorArea.innerHTML = `<div class="error-box">${message}</div>`;
}
function clearError() {
  errorArea.innerHTML = "";
}

async function loadAvailableTypes() {
  chartTypeSelect.disabled = true;
  chartTypeSelect.innerHTML = "";
  submitBtn.disabled = true;
  clearError();

  const feature = featureSelect.value;
  if (!feature) return;

  try {
    const res = await fetch(`${API_BASE}/spc/chart/available-types?canonical_feature=${encodeURIComponent(feature)}`);
    if (!res.ok) throw new Error((await res.json()).detail || `HTTP ${res.status}`);
    const types = await res.json();

    for (const t of types) {
      const opt = document.createElement("option");
      opt.value = t;
      opt.textContent = CHART_TYPE_LABELS[t] || t;
      chartTypeSelect.appendChild(opt);
    }
    chartTypeSelect.disabled = false;
    submitBtn.disabled = false;
  } catch (err) {
    showError(`無法取得可用圖表類型：${err.message}`);
  }
}

function collectParams() {
  const params = {};
  const usl = document.getElementById("p-usl").value;
  const lsl = document.getElementById("p-lsl").value;
  const target = document.getElementById("p-target").value;
  const lambda_ = document.getElementById("p-lambda").value;
  const k = document.getElementById("p-k").value;
  const h = document.getElementById("p-h").value;
  if (usl !== "") params.usl = Number(usl);
  if (lsl !== "") params.lsl = Number(lsl);
  if (target !== "") params.target = Number(target);
  if (lambda_ !== "") params.lambda_ = Number(lambda_);
  if (k !== "") params.k = Number(k);
  if (h !== "") params.h = Number(h);
  return params;
}

async function submitChart() {
  clearError();
  resultArea.innerHTML = `<p class="placeholder">運算中…</p>`;
  submitBtn.disabled = true;

  const feature = featureSelect.value;
  const chartType = chartTypeSelect.value; // e.g. "xr_plot"
  const shortType = chartType.replace(/_plot$/, ""); // -> "xr" (matches router path)

  const body = { canonical_feature: feature, ...collectParams() };

  try {
    const res = await fetch(`${API_BASE}/spc/chart/${shortType}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    renderResult(shortType, feature, data);
  } catch (err) {
    resultArea.innerHTML = "";
    showError(`產生圖表失敗：${err.message}`);
  } finally {
    submitBtn.disabled = false;
  }
}

function fmt(n) {
  if (n === null || n === undefined) return "–";
  return Number(n).toFixed(2);
}

// ---- Line chart (SVG). Handles gaps: a value of null/undefined breaks the line ----
function lineChart(series, refLines, opts = {}) {
  const width = 640, height = 200, padL = 40, padR = 12, padT = 10, padB = 20;
  const isNum = v => v !== null && v !== undefined && !Number.isNaN(v);
  const allVals = series.flatMap(s => s.values).filter(isNum).concat(refLines.map(r => r.value));
  const min = Math.min(...allVals), max = Math.max(...allVals);
  const pad = (max - min) * 0.1 || 1;
  const yMin = min - pad, yMax = max + pad;
  const n = series[0].values.length;

  const x = i => padL + (i / Math.max(1, n - 1)) * (width - padL - padR);
  const y = v => padT + (1 - (v - yMin) / (yMax - yMin)) * (height - padT - padB);

  let svg = `<svg class="chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">`;

  // gridlines
  for (let g = 0; g <= 4; g++) {
    const gy = padT + (g / 4) * (height - padT - padB);
    svg += `<line x1="${padL}" y1="${gy}" x2="${width - padR}" y2="${gy}" stroke="var(--gridline)" stroke-width="1"/>`;
  }

  // reference lines (mean / ucl / lcl / decision limits)
  for (const ref of refLines) {
    const ry = y(ref.value);
    svg += `<line x1="${padL}" y1="${ry}" x2="${width - padR}" y2="${ry}" stroke="${ref.color}" stroke-width="1.5" stroke-dasharray="4,3"/>`;
  }

  // series lines — split into separate polylines at each gap so a missing
  // reading breaks the line instead of interpolating through it
  series.forEach((s, si) => {
    let segment = [];
    const flushSegment = () => {
      if (segment.length > 1) {
        svg += `<polyline points="${segment.join(" ")}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      }
      segment = [];
    };
    s.values.forEach((v, i) => {
      if (!isNum(v)) { flushSegment(); return; }
      segment.push(`${x(i)},${y(v)}`);
    });
    flushSegment();

    s.values.forEach((v, i) => {
      if (!isNum(v)) return;
      svg += `<circle class="pt" data-series="${si}" data-i="${i}" data-v="${v}" cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.color}" stroke="var(--surface-1)" stroke-width="2"/>`;
    });
  });

  svg += `</svg>`;
  return svg;
}

// One titled chart block (SVG + legend), returning both its HTML and a
// callback to wire up the hover tooltip after it's inserted into the DOM.
function chartBlock(title, seriesName, chartLimits) {
  const id = `chart-${Math.random().toString(36).slice(2)}`;
  const series = [{ name: seriesName, color: "var(--series-1)", values: chartLimits.values }];
  const refLines = [
    { value: chartLimits.mean, color: "var(--text-muted)" },
    { value: chartLimits.ucl, color: "var(--critical)" },
    { value: chartLimits.lcl, color: "var(--critical)" },
  ];
  const html = `
    <div class="chart-card">
      <h3>${title}</h3>
      <div class="legend">
        <span class="legend-item"><span class="legend-swatch" style="background:var(--series-1)"></span>${seriesName}</span>
        <span class="legend-item"><span class="legend-line"></span>Mean / UCL / LCL</span>
      </div>
      <div class="chart-wrap" id="${id}">${lineChart(series, refLines)}</div>
    </div>`;
  return { html, attach: () => attachTooltip(document.getElementById(id), series) };
}

function attachTooltip(container, series, labels) {
  let tip = container.querySelector(".tooltip");
  if (!tip) {
    tip = document.createElement("div");
    tip.className = "tooltip";
    container.appendChild(tip);
  }
  container.querySelectorAll(".pt").forEach(pt => {
    pt.addEventListener("mouseenter", () => {
      const si = pt.dataset.series, i = pt.dataset.i, v = Number(pt.dataset.v).toFixed(3);
      const label = labels ? labels[i] : `#${i}`;
      tip.textContent = `${series[si].name}: ${v} (${label})`;
      tip.style.opacity = 1;
      tip.style.left = pt.getAttribute("cx") / 640 * container.clientWidth + "px";
      tip.style.top = pt.getAttribute("cy") / 200 * container.clientHeight + "px";
    });
    pt.addEventListener("mouseleave", () => { tip.style.opacity = 0; });
  });
}

function renderResult(shortType, feature, data) {
  clearError();

  if (shortType === "imr") {
    const c1 = chartBlock("I chart", "I", data.i_chart);
    const c2 = chartBlock("MR chart", "MR", data.mr_chart);
    resultArea.innerHTML = `<div class="panel"><h2>${feature}</h2>${c1.html}${c2.html}</div>`;
    c1.attach(); c2.attach();
    return;
  }
  if (shortType === "xr") {
    const c1 = chartBlock("X̄ chart", "X̄", data.x_bar_chart);
    const c2 = chartBlock("R chart", "R", data.r_chart);
    resultArea.innerHTML = `<div class="panel"><h2>${feature}</h2>${c1.html}${c2.html}</div>`;
    c1.attach(); c2.attach();
    return;
  }
  if (shortType === "xs") {
    const c1 = chartBlock("X̄ chart", "X̄", data.x_bar_chart);
    const c2 = chartBlock("S chart", "S", data.s_chart);
    resultArea.innerHTML = `<div class="panel"><h2>${feature}</h2>${c1.html}${c2.html}</div>`;
    c1.attach(); c2.attach();
    return;
  }
  if (shortType === "spectral") {
    const c1 = chartBlock("Spec limit", feature, data);
    resultArea.innerHTML = `<div class="panel"><h2>${feature}</h2>${c1.html}</div>`;
    c1.attach();
    return;
  }
  if (shortType === "ewma") {
    const series = [{ name: "EWMA", color: "var(--series-1)", values: data.ewma_values }];
    const refLines = [
      { value: data.mean, color: "var(--text-muted)" },
      { value: data.ucl, color: "var(--critical)" },
      { value: data.lcl, color: "var(--critical)" },
    ];
    resultArea.innerHTML = `
      <div class="panel chart-card">
        <h3>${feature} — EWMA</h3>
        <div class="legend">
          <span class="legend-item"><span class="legend-swatch" style="background:var(--series-1)"></span>EWMA</span>
          <span class="legend-item"><span class="legend-line"></span>Mean / UCL / LCL</span>
        </div>
        <div class="chart-wrap" id="chart-wrap">${lineChart(series, refLines)}</div>
      </div>`;
    attachTooltip(document.getElementById("chart-wrap"), series);
    return;
  }
  if (shortType === "cusum") {
    const series = [
      { name: "C+", color: "var(--series-1)", values: data.c_plus },
      { name: "C-", color: "var(--series-6)", values: data.c_minus },
    ];
    const refLines = [
      { value: data.decision_limit, color: "var(--critical)" },
      { value: -data.decision_limit, color: "var(--critical)" },
    ];
    resultArea.innerHTML = `
      <div class="panel chart-card">
        <h3>${feature} — CUSUM</h3>
        <div class="legend">
          <span class="legend-item"><span class="legend-swatch" style="background:var(--series-1)"></span>C+</span>
          <span class="legend-item"><span class="legend-swatch" style="background:var(--series-6)"></span>C-</span>
          <span class="legend-item"><span class="legend-line"></span>決策界限</span>
        </div>
        <div class="chart-wrap" id="chart-wrap">${lineChart(series, refLines)}</div>
      </div>`;
    attachTooltip(document.getElementById("chart-wrap"), series);
    return;
  }

  resultArea.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
}

featureSelect.addEventListener("change", loadAvailableTypes);
submitBtn.addEventListener("click", submitChart);

loadAvailableTypes();
</script>

</body>
</html>
